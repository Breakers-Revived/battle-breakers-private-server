[project]
name = "battle-breakers-private-server"
version = "0.1.0"
description = "A work in progress private server for Battle Breakers. Attempting to keep an online-only game alive after its server shutdown on 30 December 2022"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiofiles",
    "aiohttp[speedups]",
    "async-lru",
    "bcrypt",
    "brotli",
    "colorama",
    "cryptography",
    "distro",
    "faust-cchardet",
    "gitpython",
    "icalendar",
    "numpy",
    "orjson",
    "py-cpuinfo",
    "pydantic>=2.0",
    "pydantic-core",
    "pyjwt",
    "pymongo>=4.13.0",
    "rapidfuzz",
    "recurring-ical-events",
    "sanic[ext]>=25.3.0",
    "setuptools",
    "tomli",
    "urllib3",
    "uvloop ; sys_platform == 'linux'",
    "uvloop ; sys_platform == 'darwin'",
    "wheel",
]
